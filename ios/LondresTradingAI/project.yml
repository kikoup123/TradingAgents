name: LondresTradingAI
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  LondresTradingAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Londres Trading AI
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.tradingsand.londrestradingai.ctrader
            CFBundleURLSchemes:
              - londrestradingai
        LONDRES_CTRADER_CALLBACK_SCHEME: londrestradingai
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tradingsand.londrestradingai
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - LondresTradingAITests

  LondresTradingAITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: LondresTradingAI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
