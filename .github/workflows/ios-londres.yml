name: Londres iOS CI

on:
  pull_request:
    paths:
      - 'ios/LondresTradingAI/**'
      - 'docs/LONDRES_IOS_SIGNAL_APP.md'
      - '.github/workflows/ios-londres.yml'
  push:
    branches:
      - 'londres/ios-signal-journal-v1'
    paths:
      - 'ios/LondresTradingAI/**'
      - 'docs/LONDRES_IOS_SIGNAL_APP.md'
      - '.github/workflows/ios-londres.yml'

concurrency:
  group: londres-ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/LondresTradingAI
        run: xcodegen generate

      - name: Build app and tests for iOS Simulator
        working-directory: ios/LondresTradingAI
        run: >-
          xcodebuild
          -project LondresTradingAI.xcodeproj
          -scheme LondresTradingAI
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build-for-testing

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in data.values() for device in runtime if device["name"].startswith("iPhone")))')"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run deterministic iOS tests
        working-directory: ios/LondresTradingAI
        run: >-
          xcodebuild
          -project LondresTradingAI.xcodeproj
          -scheme LondresTradingAI
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO
          test-without-building
