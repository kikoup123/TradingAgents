name: Londres Market Gateway CI

on:
  pull_request:
    paths:
      - "services/londres_market_gateway/**"
      - "tradingagents/brokers/ctrader_readonly.py"
      - "tests/test_londres_market_gateway.py"
      - "tests/test_ctrader_mobile_gateway.py"
      - ".github/workflows/londres-market-gateway.yml"
  push:
    branches:
      - "londres/ios-signal-journal-v1"
    paths:
      - "services/londres_market_gateway/**"
      - "tradingagents/brokers/ctrader_readonly.py"
      - "tests/test_londres_market_gateway.py"
      - "tests/test_ctrader_mobile_gateway.py"
      - ".github/workflows/londres-market-gateway.yml"

concurrency:
  group: londres-market-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gateway and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/londres_market_gateway/requirements.txt
          pip install "pytest>=8" "ruff>=0.15"
      - name: Lint gateway
        run: >-
          ruff check
          services/londres_market_gateway
          tests/test_londres_market_gateway.py
          tests/test_ctrader_mobile_gateway.py
      - name: Import gateway without starting vendor session
        run: python -c "from services.londres_market_gateway.app import app; print(app.title)"
      - name: Run deterministic gateway tests
        run: >-
          pytest -q
          tests/test_londres_market_gateway.py
          tests/test_ctrader_mobile_gateway.py
